# StackNestViewerKit の CI。古い Swift（macos-15 の Xcode 16.4＝Swift 6.1）と新しい Swift（macos-26・xcode-27）、
# x86_64（macos-15-intel）の組み合わせで回す。手元の Swift では見えない、古い Swift だけのコンパイルエラーがあるため
# （下限の Swift 6.1 を外さない）。
# macos-15 系は DEVELOPER_DIR を Xcode 16.4 に固定する（ランナーの既定の Xcode が変わって、古い Swift で確かめる
# 役目が黙って消えないように）。指定した Xcode が無ければ、各ジョブの最初で止める。
# 協調スレッドを飽和させる試験（StackNestViewerKitPoolTests）は、同じプロセスのほかの試験を止めるので、
# 別のジョブで単独に走らせる。
# タグの Release は、ほかのジョブがすべて通った後でだけ作る（タグを打つのも CI が通った後）。
name: CI
permissions:
  contents: read
on:
  push:
    branches: [main, 'feature/**']
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  pull_request:
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            developer_dir: ''
          - os: macos-15
            developer_dir: /Applications/Xcode_16.4.app
          - os: macos-15-intel
            developer_dir: /Applications/Xcode_16.4.app
          - os: xcode-27
            developer_dir: ''
    steps:
      - name: Verify selected Xcode exists
        shell: bash
        run: |
          if [ -n "$DEVELOPER_DIR" ] && [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::DEVELOPER_DIR does not exist: $DEVELOPER_DIR"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Internal markers (the vocabulary in Scripts/internal-markers.txt is public)
        run: Scripts/check-internal-markers.sh tree HEAD
      - name: Test scripts
        run: python3 -m unittest discover -s Tests/Scripts -p 'test_*.py'
      - run: swift --version
      - run: swift build
      - run: swift test
  pool:
    name: Pool saturation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            developer_dir: ''
          - os: macos-15
            developer_dir: /Applications/Xcode_16.4.app
          - os: macos-15-intel
            developer_dir: /Applications/Xcode_16.4.app
          - os: xcode-27
            developer_dir: ''
    steps:
      - name: Verify selected Xcode exists
        shell: bash
        run: |
          if [ -n "$DEVELOPER_DIR" ] && [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::DEVELOPER_DIR does not exist: $DEVELOPER_DIR"
            exit 1
          fi
      - uses: actions/checkout@v7
      - name: Blocking reader with a saturated cooperative pool
        timeout-minutes: 10
        env:
          STACKNEST_KIT_POOL_TEST: '1'
        run: swift test --filter StackNestViewerKitPoolTests
  samples:
    name: Samples, host modes and end-to-end
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - name: Build samples (host-mode checks treat warnings as errors)
        run: swift build --package-path Samples
      - name: End-to-end tests against the fake server on 127.0.0.1
        timeout-minutes: 10
        run: swift test --package-path Samples
  documentation:
    name: Documentation and examples
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build documentation and typecheck every example
        run: python3 Scripts/build-documentation.py --output-dir .build/documentation/site --derived-data .build/documentation/DerivedData
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: .build/documentation/site
  pages:
    name: Publish documentation
    needs: [test, pool, samples, documentation]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - uses: actions/deploy-pages@v5
        id: deployment
  release-artifact:
    # 公開のモジュールが library evolution の下でも通り、module interface を出せることだけを確かめる
    # （動的ライブラリのプロダクトはまだ持たない。要るときにソースを直さずに足せるようにしておく）。
    name: Module interfaces (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            developer_dir: ''
          - os: xcode-27
            developer_dir: ''
          - os: macos-15
            developer_dir: /Applications/Xcode_16.4.app
    steps:
      - name: Verify selected Xcode exists
        shell: bash
        run: |
          if [ -n "$DEVELOPER_DIR" ] && [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::DEVELOPER_DIR does not exist: $DEVELOPER_DIR"
            exit 1
          fi
      - uses: actions/checkout@v7
      - run: swift --version
      - name: Build with library evolution
        run: |
          swift build -c release --target StackNestViewerKit \
              -Xswiftc -enable-library-evolution \
              -Xswiftc -emit-module-interface \
              -Xswiftc -verify-emitted-module-interface
      - name: Verify module interfaces were emitted
        shell: bash
        run: |
          for module in StackNestViewerKit StackNestViewerKitCore; do
            interfaces="$(find .build -type f -name "${module}.swiftinterface" -not -path '*ModuleCache*' -print)"
            if [ -z "$interfaces" ]; then
              echo "::error::Missing ${module}.swiftinterface"
              exit 1
            fi
            printf '%s\n' "$interfaces"
          done
  api-breakage:
    # 0.x の間は知らせだけ（失敗にしない）。公開先にタグが無い間は比べる元が無いので飛ばす。
    name: API breakage (notice)
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Compare with the latest tag
        shell: bash
        run: |
          # X.Y.Z だけを比べる元にする（接尾辞付き・v 付きのタグは選ばない）。タグが無いときの grep の終了コード 1 で止まらないようにする。
          latest="$(git tag --list --sort=-v:refname | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n 1)"
          if [ -z "$latest" ]; then
            echo "::notice::No release tag yet; skipping the API breakage check."
            exit 0
          fi
          swift package diagnose-api-breaking-changes "$latest"
  release:
    name: Publish GitHub Release
    needs: [test, pool, samples, documentation, release-artifact]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Publish the verified tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 Scripts/publish-github-release.py "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY"
