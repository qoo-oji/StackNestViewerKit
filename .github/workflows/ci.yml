# StackNestViewerKit の CI（立ち上げの段: 試験だけ）。文書・Samples・module interface・Release のジョブは 0.1.0 の作業で足す。
# 古い Swift（macos-15 の Xcode 16.4＝Swift 6.1）と新しい Swift（macos-26・xcode-27）、x86_64（macos-15-intel）で回す。
# macos-15 系は DEVELOPER_DIR を固定する（ランナーの既定の Xcode が変わって、古い Swift で確かめる役目が黙って消えないように）。
name: CI
permissions:
  contents: read
on:
  push:
    branches: [main, 'feature/**']
    tags: ['*']
  pull_request:
jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      DEVELOPER_DIR: ${{ matrix.developer_dir }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            developer_dir: ''
          - os: macos-15
            developer_dir: /Applications/Xcode_16.4.app
          - os: macos-15-intel
            developer_dir: /Applications/Xcode_16.4.app
          - os: xcode-27
            developer_dir: ''
    steps:
      - name: Verify selected Xcode exists
        shell: bash
        run: |
          if [ -n "$DEVELOPER_DIR" ] && [ ! -d "$DEVELOPER_DIR" ]; then
            echo "::error::DEVELOPER_DIR does not exist: $DEVELOPER_DIR"
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Internal markers (the vocabulary in Scripts/internal-markers.txt is public)
        run: Scripts/check-internal-markers.sh tree HEAD
      - name: Test scripts
        run: python3 -m unittest discover -s Tests/Scripts -p 'test_*.py'
      - run: swift --version
      - run: swift build
      - run: swift test
